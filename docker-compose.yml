version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    container_name: vision_backend

  frontend:
    build: ./src/frontend
    ports:
      - "5173:5173"
    container_name: vision_frontend
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://frontend:5173
    container_name: vision_tunnel
    depends_on:
      - frontend