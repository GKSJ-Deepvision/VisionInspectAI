services:
  - type: web
    name: visioninspect-ai-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: visioninspect-postgres
          property: connectionString

databases:
  - name: visioninspect-postgres
    plan: free
    region: oregon
    databaseName: visioninspect_ai
    user: visioninspect_user
